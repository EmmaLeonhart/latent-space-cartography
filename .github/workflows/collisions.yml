name: Reproduce mxbai Collisions

# Two-sided regression test for the diacritic-collapse defect.
#
# The defect is NOT an inherent property of mxbai-embed-large and is
# NOT years old. It is a regression in the Ollama runtime, bisected to
# v0.14.0 (released 2026-01-10): the identical mxbai-embed-large
# registry blob is healthy on Ollama <= v0.13.4 and defective on
# >= v0.14.0 (verified by .github/workflows/collision-bisect.yml across
# 21 Ollama releases). So we assert BOTH sides of the boundary:
#
#   1. `clean-baseline`   — Ollama v0.13.4. The model MUST be healthy
#      (diacritical collisions ~0, like the ASCII control). Runs the
#      scan with LSC_EXPECT_CLEAN=1; a red here means the model blob
#      was re-cut or the v0.14.0 boundary moved.
#
#   2. `regression-repro` — Ollama v0.14.0 (first defective release).
#      The defect MUST reproduce (diacritical rate >> ASCII control).
#      This is the stable, pinned reproduction the paper rests on.
#
#   3. `current-drift`    — whatever Ollama the installer serves today,
#      LSC_SOFT_FAIL=1. If upstream ever reverts the regression this
#      goes green-with-DRIFT-annotation rather than red.
#
# Scan internals (same script for every job):
#   - ~600-900 Wikidata settlements with diacritical native labels
#     (cs/pl/vi/de/fr/ro/hu/tr/sk/pt/es/is) + ~300 ASCII-control ones
#   - Embed via Ollama, compute pairwise cosines, count collisions @0.95
#   - Healthy: diacritical rate ~= ASCII control (~0). Defective:
#     diacritical rate ~10-11%, ASCII control ~0.
#
# Triggers: daily cron 07:13 UTC, on-push to script/workflow, manual.

on:
  schedule:
    - cron: "13 7 * * *"
  push:
    branches: [master, main]
    paths:
      - "scripts/wikidata_collision_scan.py"
      - ".github/workflows/collisions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collisions
  cancel-in-progress: false

env:
  # Last Ollama release BEFORE the regression (2025-12-13). Model is
  # healthy here. Bump only if the bisected boundary itself moves.
  CLEAN_OLLAMA_VERSION: "0.13.4"
  # First Ollama release WITH the regression (2026-01-10). Stable
  # pinned reproduction of the paper's finding.
  DEFECT_OLLAMA_VERSION: "0.14.0"

jobs:
  clean-baseline:
    name: Clean baseline (Ollama v0.13.4 — must be healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install --quiet numpy
      - name: Install Ollama (pinned ${{ env.CLEAN_OLLAMA_VERSION }})
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="${CLEAN_OLLAMA_VERSION}" sh
          ollama --version
      - name: Start Ollama daemon
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && { echo "Ollama is up"; break; }
            sleep 1
          done
      - name: Pull mxbai-embed-large
        run: |
          ollama pull mxbai-embed-large
          ollama list
      - name: Run scan (expect CLEAN — fail if the defect appears here)
        env:
          LSC_EXPECT_CLEAN: "1"
        run: python scripts/wikidata_collision_scan.py
      - name: Upload clean-baseline summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-collision-summary-clean
          path: wikidata_collision_summary.json
          retention-days: 90

  regression-repro:
    name: Regression reproduction (Ollama v0.14.0 — must show defect)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install --quiet numpy
      - name: Install Ollama (pinned ${{ env.DEFECT_OLLAMA_VERSION }})
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="${DEFECT_OLLAMA_VERSION}" sh
          ollama --version
      - name: Start Ollama daemon
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && { echo "Ollama is up"; break; }
            sleep 1
          done
      - name: Pull mxbai-embed-large
        run: |
          ollama pull mxbai-embed-large
          ollama list
      - name: Run scan (expect DEFECT — fail if it stops reproducing)
        run: python scripts/wikidata_collision_scan.py
      - name: Upload regression-repro summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-collision-summary-repro
          path: wikidata_collision_summary.json
          retention-days: 90

  current-drift:
    name: Current Ollama (drift detector, soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install --quiet numpy
      - name: Install Ollama (current)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
      - name: Start Ollama daemon
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && { echo "Ollama is up"; break; }
            sleep 1
          done
      - name: Pull mxbai-embed-large
        run: |
          ollama pull mxbai-embed-large
          ollama list
      - name: Run scan (soft-fail — reports drift, never red)
        env:
          LSC_SOFT_FAIL: "1"
        run: python scripts/wikidata_collision_scan.py
      - name: Upload current summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-collision-summary-current
          path: wikidata_collision_summary.json
          retention-days: 90

  report:
    name: Boundary report
    runs-on: ubuntu-latest
    needs: [clean-baseline, regression-repro, current-drift]
    if: always()
    steps:
      - name: Download summaries
        uses: actions/download-artifact@v4
        with:
          path: summaries/
          pattern: wikidata-collision-summary-*
      - name: Compare clean / repro / current
        run: |
          python - <<'PY'
          import json, os, pathlib

          def load(name):
              p = pathlib.Path(f"summaries/wikidata-collision-summary-{name}/wikidata_collision_summary.json")
              return json.loads(p.read_text()) if p.exists() else None

          labels = [("clean", "v0.13.4 (clean baseline)"),
                    ("repro", "v0.14.0 (regression repro)"),
                    ("current", "current Ollama")]
          print("=" * 72)
          print(f"{'config':<28} {'diac_rate':>10} {'diac_cos':>9} {'ascii_rate':>11}")
          out = ["## Diacritic-collapse boundary report", "",
                 "| config | diac rate | diac cos | ascii rate |",
                 "|---|---|---|---|"]
          rates = {}
          for key, desc in labels:
              s = load(key)
              if not s:
                  print(f"{desc:<28} {'(missing)':>10}")
                  out.append(f"| {desc} | (missing) | | |")
                  continue
              d = s["labels"]["diacritical"]; a = s["labels"]["ascii_control"]
              rates[key] = d["collision_rate"]
              print(f"{desc:<28} {d['collision_rate']:>10.4f} "
                    f"{d['mean_cosine']:>9.3f} {a['collision_rate']:>11.4f}")
              out.append(f"| {desc} | {d['collision_rate']:.4f} | "
                         f"{d['mean_cosine']:.3f} | {a['collision_rate']:.4f} |")

          out.append("")
          if "current" in rates and "repro" in rates:
              if rates["current"] < 0.05 <= rates["repro"]:
                  out.append("**UPSTREAM DRIFT: the regression no longer "
                             "reproduces on current Ollama — it appears to "
                             "have been fixed. Update the paper's status.**")
              else:
                  out.append("_Current Ollama still exhibits the regression "
                             "(expected)._")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              pathlib.Path(summary).write_text("\n".join(out) + "\n")
          PY
