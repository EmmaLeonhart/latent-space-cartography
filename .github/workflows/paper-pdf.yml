name: Paper PDF (NeurIPS-styled)

# Builds paper.pdf from paper.md via the Sutra-style pipeline:
#   sed pre-pass -> pandoc (markdown -> LaTeX body) -> latexmk -pdf
#   with the official NeurIPS 2026 style file (neurips_2026.sty).
#
# This replaces the old fpdf2 scripts/generate_pdf.py text-dump. The
# built PDF is committed back as paper.pdf AND docs/paper.pdf so the
# repo PDF and the Pages download link (latent-space.emmaleonhart.com
# /paper.pdf) are both the typeset NeurIPS version. Committing
# docs/paper.pdf re-triggers the Pages deploy; committing paper.pdf /
# docs/paper.pdf does NOT trigger publish.yml (it watches paper.md /
# SKILL.md only), so there is no clawRxiv resubmit loop.

on:
  push:
    branches: [master, main]
    paths:
      - "paper.md"
      - "paper.tex"
      - "neurips_2026.sty"
      - ".github/workflows/paper-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-pdf
  cancel-in-progress: false

jobs:
  build-pdf:
    name: Build NeurIPS-styled paper.pdf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Install TeX Live + pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            latexmk \
            pandoc

      - name: Generate paper.tex.body from paper.md
        run: |
          # Pre-process paper.md before pandoc:
          #  1. Strip the H1 title line (rendered by paper.tex's
          #     \maketitle; emitting it as a section duplicates it).
          #  2. Strip the standalone "**Emma Leonhart**" byline
          #     (rendered by paper.tex's \author block).
          #  3. Strip the MANUAL section numbers ("## 1. Introduction"
          #     -> "## Introduction", "### 1.1 Key Findings" ->
          #     "### Key Findings") so LaTeX's own section numbering
          #     does not double them ("1 1. Introduction").
          #  4. Tag Abstract / References as pandoc {-} unnumbered so
          #     they render \section* (no auto number).
          # All transformations are per-build only; paper.md on disk is
          # unchanged.
          sed \
            -e '1{/^# /d}' \
            -e '/^\*\*Emma Leonhart\*\*$/d' \
            -e 's|^## [0-9]\+\. |## |' \
            -e 's|^### [0-9]\+\.[0-9]\+ |### |' \
            -e 's|^## Abstract$|## Abstract {-}|' \
            -e 's|^## References$|## References {-}|' \
            paper.md > paper-pre.md
          # --from=markdown-smart (not gfm): the gfm reader does not
          # support raw_tex, which would escape any raw LaTeX to literal
          # monospace. --shift-heading-level-by=-1: with the H1 stripped,
          # promote ## -> \section, ### -> \subsection (auto-numbered).
          pandoc paper-pre.md \
            --from=markdown-smart \
            --to=latex \
            --output=paper.tex.body \
            --wrap=preserve \
            --no-highlight \
            --shift-heading-level-by=-1

      - name: Build PDF (named / preprint)
        run: |
          # NeurIPS 2026 requires pdflatex per the official CFP.
          # max_repeat=8 lets latexmk converge cross-references with
          # floating tables.
          latexmk -pdf -interaction=nonstopmode \
            -e '$max_repeat=8' paper.tex

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper.pdf
          retention-days: 90

      - name: Commit paper.pdf + docs/paper.pdf if changed
        run: |
          cp paper.pdf docs/paper.pdf
          if git diff --quiet paper.pdf docs/paper.pdf 2>/dev/null; then
            echo "PDF unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper.pdf docs/paper.pdf
          git commit -m "Auto-build NeurIPS-styled paper.pdf from paper.md"
          git push
