name: "Publish and Fetch Review"

# AUTO-SUBMIT RE-ENABLED 2026-05-17.
# The clawRxiv competition is OVER (deadline ~Apr 20, 2026 has passed), so
# there is no Strong-Accept rating left to protect. Auto-submit is back on
# purely to keep getting AI peer-review FEEDBACK on each paper iteration.
# Pushing paper.md/SKILL.md auto-supersedes the post recorded in .post_id —
# that is intended now; the review signal is the point, not the rating.
on:
  push:
    branches: [master, main]
    paths:
      - "paper.md"
      - "SKILL.md"
  workflow_dispatch:
    inputs:
      supersedes:
        description: "Post ID to supersede (leave empty to auto-supersede last submission)"
        required: false
        type: string
      force_submit:
        description: "Submit even if paper.md/SKILL.md content hash is unchanged (use to verify the pipeline)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    outputs:
      post_id: ${{ steps.submit.outputs.post_id }}
      paper_id: ${{ steps.submit.outputs.paper_id }}
      submitted: ${{ steps.submit.outputs.submitted }}
      recorded: ${{ steps.submit.outputs.recorded }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # PDF generation moved to .github/workflows/paper-pdf.yml
      # (NeurIPS-styled pandoc + latexmk build). publish.yml is now
      # purely the clawRxiv submit + fetch-review pipeline.

      - name: Compute content hash
        id: content_hash
        run: |
          HASH=$(cat paper.md SKILL.md | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check if submission needed
        id: submit_check
        run: |
          if [ "${{ github.event.inputs.force_submit }}" = "true" ]; then
            echo "force_submit requested — bypassing content-hash gate"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ -f .last_submitted_hash ] && [ "$(cat .last_submitted_hash)" = "${{ steps.content_hash.outputs.hash }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to clawRxiv
        id: submit
        if: steps.submit_check.outputs.needed == 'true'
        env:
          CLAWRXIV_API_KEY: ${{ secrets.CLAWRXIV_API_KEY }}
        run: |
          python - <<'PYEOF'
          import json, re, urllib.request, urllib.error, os, sys

          # clawRxiv changed its revision API (2026-05-18): the old
          # `POST /api/posts` + `supersedes` field now 409s
          # ("already been revised" / "duplicate detected"). The
          # current API is `POST /api/posts/{id}/revise`, and a 409
          # body carries `data.duplicateId` naming the canonical
          # live post. This step mirrors that contract.
          API_KEY = os.environ.get("CLAWRXIV_API_KEY", "")
          GH_OUT = os.environ["GITHUB_OUTPUT"]
          CLAWRXIV_BASE = "https://clawrxiv.io"

          def out(**kw):
              with open(GH_OUT, "a") as f:
                  for k, v in kw.items():
                      f.write(f"{k}={v}\n")

          if not API_KEY:
              print("No CLAWRXIV_API_KEY set — skipping submission")
              out(submitted="false", recorded="false")
              sys.exit(0)

          class SupersedeConflict(RuntimeError):
              """HTTP 409 from clawRxiv (stale supersede target, or
              dedup). Carries the parsed JSON body so callers can
              follow data.duplicateId to the canonical live post."""
              def __init__(self, message, body=None):
                  super().__init__(message)
                  self.body = body or {}
              def duplicate_id(self):
                  v = (self.body.get("data") or {}).get("duplicateId")
                  if isinstance(v, bool):
                      return None
                  if isinstance(v, int):
                      return v
                  if isinstance(v, str) and v.isdigit():
                      return int(v)
                  return None

          def post_json(url, payload):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  url, data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {API_KEY}",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace") if e.fp else ""
                  if e.code == 409:
                      try:
                          parsed = json.loads(err_body)
                      except (ValueError, TypeError):
                          parsed = {}
                      raise SupersedeConflict(
                          f"clawRxiv HTTP 409: {err_body}", body=parsed
                      ) from e
                  raise RuntimeError(
                      f"clawRxiv request failed: HTTP {e.code}: {err_body}"
                  ) from e

          def create_post(payload):
              return post_json(f"{CLAWRXIV_BASE}/api/posts", payload)

          def revise_post(post_id, payload):
              return post_json(
                  f"{CLAWRXIV_BASE}/api/posts/{post_id}/revise", payload
              )

          supersedes = "${{ inputs.supersedes }}".strip()
          if not supersedes:
              try:
                  with open(".post_id", "r") as f:
                      supersedes = f.read().strip()
              except FileNotFoundError:
                  supersedes = ""

          with open("paper.md", "r") as f:
              content = f.read()
          with open("SKILL.md", "r") as f:
              skill = f.read()

          abstract_match = re.search(r'## Abstract\s*\n(.*?)(?=\n## [0-9])', content, re.DOTALL)
          abstract = abstract_match.group(1).strip() if abstract_match else content[:500]

          payload = {
              "title": "Latent Space Cartography Applied to Wikidata: Relational Displacement Analysis Reveals a Silent Tokenizer Defect in mxbai-embed-large",
              "abstract": abstract,
              "content": content,
              "skill_md": skill,
              "tags": ["embedding-spaces", "knowledge-graphs", "vector-arithmetic", "tokenizer-failures", "neuro-symbolic"],
              "human_names": ["Emma Leonhart"],
          }

          def emit_success(resp):
              print(f"Published: {json.dumps(resp, indent=2)[:1500]}")
              post_id = str(resp.get("id") or resp.get("postId") or "")
              paper_id = str(resp.get("paper_id") or resp.get("paperId") or "")
              if not post_id:
                  print(f"ERROR: response has no id/postId: {json.dumps(resp)[:500]}", file=sys.stderr)
                  out(submitted="false", recorded="false")
                  sys.exit(1)
              out(post_id=post_id, paper_id=paper_id,
                  submitted="true", recorded="true")
              sys.exit(0)

          try:
              if supersedes:
                  print(f"Revising existing post {supersedes} (POST /api/posts/{supersedes}/revise)")
                  resp = revise_post(supersedes, payload)
              else:
                  print("Creating NEW clawRxiv post (no .post_id found)")
                  resp = create_post(payload)
          except SupersedeConflict as e:
              dup = e.duplicate_id()
              if dup is None:
                  print(f"ERROR: clawRxiv 409 with no data.duplicateId to recover from:\n  {e}", file=sys.stderr)
                  out(submitted="false", recorded="false")
                  sys.exit(1)
              # clawRxiv's dedup response names the canonical live
              # post. Follow it and revise THAT — deterministic
              # self-heal of a stale/drifted .post_id from the API.
              print(f"WARNING: clawRxiv says the live version of this work is post {dup} (HTTP 409). Revising post {dup}.", file=sys.stderr)
              try:
                  resp = revise_post(dup, payload)
              except SupersedeConflict as e2:
                  # Even revising the canonical is a duplicate: the
                  # manuscript is not substantively different from
                  # what is already on clawRxiv. No-op, not a
                  # failure — pin .post_id and succeed.
                  pin = e2.duplicate_id() or dup
                  print(f"NOTE: clawRxiv finds no substantive change vs post {pin}; treating as up-to-date and pinning .post_id={pin}.", file=sys.stderr)
                  out(post_id=str(pin), submitted="false", recorded="true")
                  sys.exit(0)
              except Exception as e2:  # noqa: BLE001
                  print(f"ERROR: revising canonical post {dup} failed: {e2}", file=sys.stderr)
                  out(submitted="false", recorded="false")
                  sys.exit(1)
          except Exception as e:  # noqa: BLE001
              print(f"ERROR: {e}", file=sys.stderr)
              out(submitted="false", recorded="false")
              sys.exit(1)

          emit_success(resp)
          PYEOF

      - name: Save post ID and submission hash
        if: steps.submit.outputs.recorded == 'true'
        run: |
          echo "${{ steps.submit.outputs.post_id }}" > .post_id
          if [ -n "${{ steps.submit.outputs.paper_id }}" ]; then
            echo "${{ steps.submit.outputs.paper_id }}" > .paper_id
          fi
          echo "${{ steps.content_hash.outputs.hash }}" > .last_submitted_hash
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .post_id .last_submitted_hash
          [ -f .paper_id ] && git add .paper_id || true
          MSG="Record submission: post ${{ steps.submit.outputs.post_id }}"
          if [ -n "${{ steps.submit.outputs.paper_id }}" ]; then
            MSG="$MSG (paper ${{ steps.submit.outputs.paper_id }})"
          fi
          git commit -m "$MSG" || true
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push || true

  fetch-review:
    needs: generate-and-publish
    if: needs.generate-and-publish.outputs.submitted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Pull latest (in case publish job pushed)
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Wait for AI peer review and fetch
        env:
          POST_ID: ${{ needs.generate-and-publish.outputs.post_id }}
          PAPER_ID: ${{ needs.generate-and-publish.outputs.paper_id }}
        run: |
          python - <<'PYEOF'
          import json, urllib.request, os, sys, time
          from datetime import datetime, timezone

          POST_ID = os.environ["POST_ID"]
          PAPER_ID = os.environ.get("PAPER_ID", "unknown")
          if not POST_ID:
              print("No post ID — cannot fetch review")
              sys.exit(1)

          os.makedirs("reviews", exist_ok=True)

          # Retry schedule: every 15min, up to 2 hours total
          RETRY_INTERVAL = 15 * 60  # 15 minutes
          MAX_WAIT = 2 * 60 * 60    # 2 hours total
          elapsed = 0
          attempt = 0

          while elapsed <= MAX_WAIT:
              attempt += 1
              print(f"\nAttempt {attempt}: fetching AI review for post {POST_ID}...")
              url = f"https://clawrxiv.io/api/posts/{POST_ID}/review"
              try:
                  req = urllib.request.Request(url)
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read())
                      review = data.get("review")

                      if review:
                          rating = review.get("rating", "Unknown")
                          model = review.get("model", "Unknown")
                          print(f"Found review! Rating: {rating}, Model: {model}")

                          ts = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")

                          # Save raw JSON
                          review_file = f"reviews/review_{ts}.json"
                          with open(review_file, "w") as f:
                              json.dump(review, f, indent=2)
                          print(f"Saved JSON to {review_file}")

                          # Save human-readable markdown
                          md_file = f"reviews/review_{ts}.md"
                          with open(md_file, "w") as f:
                              f.write(f"# AI Peer Review — Post {POST_ID}\n\n")
                              f.write(f"**Paper ID:** {PAPER_ID}\n")
                              f.write(f"**Rating:** {rating}\n")
                              f.write(f"**Model:** {model}\n")
                              f.write(f"**Reviewed:** {review.get('createdAt', '')}\n\n")
                              f.write(f"## Summary\n\n{review.get('summary', '')}\n\n")
                              f.write("## Strengths\n\n")
                              for p in review.get("pros", []):
                                  f.write(f"- {p}\n")
                              f.write("\n## Weaknesses\n\n")
                              for c in review.get("cons", []):
                                  f.write(f"- {c}\n")
                              f.write(f"\n## Justification\n\n{review.get('justification', '')}\n")
                          print(f"Saved markdown to {md_file}")

                          sys.exit(0)
                      else:
                          print("Review field empty.")

              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print("No review yet (404).")
                  else:
                      print(f"HTTP error {e.code}: {e.read().decode()}")
              except Exception as e:
                  print(f"Error: {e}")

              if elapsed + RETRY_INTERVAL > MAX_WAIT:
                  break

              print(f"Waiting {RETRY_INTERVAL // 60} minutes before retry...")
              time.sleep(RETRY_INTERVAL)
              elapsed += RETRY_INTERVAL

          print(f"\nNo AI review after {elapsed // 60} minutes ({attempt} attempts). Giving up.")
          with open("reviews/no_review_yet.txt", "w") as f:
              f.write(f"No AI review for post {POST_ID} after {attempt} attempts over {elapsed // 60} minutes.\n")
              f.write(f"Last check: {datetime.now(timezone.utc).isoformat()}\n")
          PYEOF

      - name: Commit review if found
        run: |
          if [ -d reviews ] && [ "$(ls -A reviews 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reviews/
            git commit -m "Fetch peer review for post ${{ needs.generate-and-publish.outputs.post_id }}" || true
            git push || true
          fi
