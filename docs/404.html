<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Latent Space Cartography</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f2ec; --surface: #efe9df; --card: #ece4d6;
    --accent: #b8553a; --text: #2d2a26; --dim: #6e6a61;
    --blue: #3f6487; --border: #d9d1c1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  .wrap { max-width: 540px; }
  .code {
    font-size: 4.5rem; font-weight: 700; color: var(--accent);
    letter-spacing: -0.02em; line-height: 1;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.6rem; }
  p { color: var(--dim); margin-bottom: 1.6rem; }
  .links { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  .links a {
    display: inline-block; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 1.1rem; color: var(--text);
    text-decoration: none; font-size: 0.95rem; transition: border-color 0.15s, transform 0.15s;
  }
  .links a:hover { border-color: var(--accent); transform: translateY(-2px); }
  code {
    background: var(--surface); padding: 0.1rem 0.35rem; border-radius: 3px;
    font-family: 'Cascadia Code', Consolas, monospace; font-size: 0.86em;
    color: var(--accent); border: 1px solid var(--border);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d22; --surface: #26282f; --card: #2d3038;
      --accent: #d97757; --text: #e8e4dc; --dim: #9a9589;
      --blue: #85a8c4; --border: #3a3d46;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Off the map</h1>
  <p>That page isn't part of this latent space. The vector you followed lands in <code>[UNK]</code> territory.</p>
  <div class="links">
    <a href="/">Home</a>
    <a href="/tokenization-error.html">The defect report</a>
    <a href="/paper.pdf">The paper (PDF)</a>
    <a href="/arxiv.html">arXiv submission</a>
  </div>
</div>
</body>
</html>
